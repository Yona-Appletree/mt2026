[package]
name = "mt-app-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Excluded from the workspace `default-members` (see the root Cargo.toml) —
# build it with `just build-web` / `just dev`, which shell out to `dx`.
#
# Pinned to =0.7.9: `dx` refuses to build against a dioxus crate version it
# doesn't recognize, and the installed `dx` here is 0.7.9 while crates.io's
# latest `dioxus` was 0.7.10 as of this writing.
[dependencies]
dioxus = { version = "=0.7.9", features = ["web"] }
# Timer messages (arpeggio-done, auto-stop) re-enter the drill coroutine
# through an mpsc merged with its UI inbox; already in the tree via dioxus.
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
# `StreamExt` for the control coroutine's `rx.next().await` — the extension
# trait dioxus's own `use_coroutine` docs tell you to pull in.
futures-util = { version = "0.3", default-features = false }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
# Recording-elapsed ticks. `wasm32` has no `std::thread::sleep`.
gloo-timers = { version = "0.3", default-features = false, features = ["futures"] }
js-sys = "0.3"
# The drill loop (P6): control plane, DSP, and theory all live in the core
# crates; this crate only adapts them to the browser.
mt-pitch = { path = "../mt-pitch" }
mt-session = { path = "../mt-session" }
mt-theory = { path = "../mt-theory" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# web-sys is feature-gated per interface; this is exactly what the capture
# adapter (`src/recorder.rs`) and the save call (`src/api.rs`) touch.
[dependencies.web-sys]
version = "0.3"
features = [
  # getUserMedia + the raw-capture constraints, and the device label.
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MediaTrackConstraints",
  # AudioContext → worklet graph.
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "BaseAudioContext",
  "MediaStreamAudioSourceNode",
  "MessageEvent",
  "MessagePort",
  "Worklet",
  # The multipart POST body.
  "Blob",
  "FormData",
  # Drill reference tones (oscillator + gain envelope).
  "AudioParam",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
  # The live pitch-trace canvas.
  "CanvasRenderingContext2d",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  # Document-level keydown for the one-keypress record path.
  "Document",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "Navigator",
  "Window",
]
